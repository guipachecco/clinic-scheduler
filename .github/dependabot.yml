# Weekly update PRs; CI says whether each one is safe to merge.
# Security alerts and security updates are enabled in the repository settings
# (Settings > Code security) and do not wait for this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    # Waits a few days before proposing a fresh release, which avoids most
    # compromised packages that get pulled shortly after publishing.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    groups:
      actions:
        patterns: ["*"]
