# PostgreSQL para desenvolvimento local: docker compose up -d
# Usuário e senha abaixo valem só para esta máquina. Produção usa outro banco,
# com credenciais próprias guardadas na hospedagem.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic_scheduler
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
